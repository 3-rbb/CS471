<!DOCTYPE html>
<html>
{% load static %}
<head>
    <title>{% block title %}{% endblock title %}</title>

    <link rel="icon" href="{% static 'qu-icon.png' %}">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

{% include "includes/header.html" %}

{% if messages %}
<div style="margin: 20px; padding: 15px; border-radius: 5px;">
    {% for message in messages %}
        <div style="padding: 10px; margin: 10px 0; border-radius: 3px; {% if message.tags == 'success' %}background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;{% elif message.tags == 'error' %}background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;{% else %}background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db;{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

{% block content %}
{% endblock content %}

{% include "includes/footer.html" %}

</body>
</html>
